name: quoswift
description: A premium invoice, quotation, and payment reminder mobile app for freelancers and small businesses.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.3.1
  go_router: ^17.0.0
  google_fonts: ^8.1.0
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  lottie: ^3.3.1
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  supabase_flutter: ^2.12.4
  uuid: ^4.5.1
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8
  pdf: ^3.12.0
  printing: ^5.14.2
  share_plus: ^12.0.2
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
