name: quoswift
description: A premium invoice, quotation, and payment reminder mobile app for freelancers and small businesses.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.3.1
  go_router: ^17.0.0
  google_fonts: ^8.1.0
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  lottie: ^3.3.1
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  supabase_flutter: ^2.12.4
  uuid: ^4.5.1
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8
  pdf: ^3.12.0
  printing: ^5.14.2
  share_plus: ^12.0.2
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.0
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  purchases_flutter: ^10.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/quoswift_launcher_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/quoswift_adaptive_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/branding/quoswift_splash.png
  android: true
  ios: true
  web: false
  fullscreen: true

  android_12:
    color: "#FFFFFF"
    image: assets/branding/quoswift_splash_android12.png
